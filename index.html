<!doctype html>
<html lang="en">
<head>

<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
  :root{
    --bg: #0b0e14;
    --bg-2: #11151f;
    --surface: #161b28;
    --surface-2: #1d2333;
    --border: #262d40;
    --text: #eef1f8;
    --text-dim: #9aa3b8;
    --gold: #e8b84b;
    --gold-soft: rgba(232,184,75,0.12);
    --radius: 14px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    background:var(--bg);
    color:var(--text);
    font-family:'Manrope',system-ui,sans-serif;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
  }
  .wrap{max-width:640px;width:100%;text-align:center;}
  .brand{font-family:'Sora',system-ui,sans-serif;font-size:28px;font-weight:800;margin-bottom:8px;}
  .brand span{color:var(--gold);}
  p.lead{color:var(--text-dim);font-size:15px;margin:0 0 32px;}
  .geo-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;}
  .geo-grid a{
    display:flex;flex-direction:column;align-items:center;gap:6px;
    background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
    padding:18px 8px;color:var(--text);text-decoration:none;font-weight:600;font-size:13px;
  }
  .geo-grid a:hover{border-color:var(--gold);background:var(--surface-2);}
  .geo-grid .flag{font-size:28px;}
  @media (max-width:520px){ .geo-grid{grid-template-columns:repeat(2,1fr);} }
</style>
</head>
<body>
  <div class="wrap">
    <div class="brand">Go<span>Clarivo</span></div>
    <p class="lead">Independent online casino comparisons. Choose your region / Elige tu región / Wähle deine Region.</p>

      <a href="/ar/">🇦🇷<span>Argentina</span></a>
      <a href="/it/">🇮🇹<span>Italia</span></a>
      <a href="/pe/">🇵🇪<span>Perú</span></a>
      <a href="/bo/">🇧🇴<span>Bolivia</span></a>
      <a href="/py/">🇵🇾<span>Paraguay</span></a>
    </div>
  </div>
</body>
