name: Update last-verified dates daily

# Stamps today's date (UTC) into every "last verified / last updated" date on the
# site (homepage hero stat, review/compare bylines, legal pages, JSON-LD
# dateModified, sitemap lastmod) via scripts/update_dates.py, then commits if
# anything changed. Runs every day shortly after 00:00 UTC; can also be run by
# hand from the Actions tab.

on:
  schedule:
    - cron: "7 0 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update-dates
  cancel-in-progress: false

jobs:
  stamp:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Stamp today's date
        run: python scripts/update_dates.py

      - name: Commit and push if changed
        run: |
          git config user.name "goclarivo-bot"
          git config user.email "actions@users.noreply.github.com"
          if git diff --quiet; then
            echo "No changes -- already stamped today."
            exit 0
          fi
          git add -A
          git commit -m "chore: daily date refresh"
          for attempt in 1 2 3 4 5; do
            if git push; then echo "Pushed."; exit 0; fi
            echo "Push rejected -- retrying ($attempt/5)..."
            git fetch origin main
            git rebase origin/main
            sleep 5
          done
          echo "Push still failing after 5 retries." >&2
          exit 1
