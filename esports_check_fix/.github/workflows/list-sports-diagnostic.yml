name: List 1xBet sports (diagnostic)

# Read-only diagnostic: calls the 1xBet partner API's own sports directory
# endpoint and prints every sport it returns (id + name), plus a check for
# esports/cybersport keywords in the raw response. Never writes to any file
# and never commits/pushes anything -- it only exists to answer, from the
# real API instead of a guess, whether a genuine esports category is
# available before anything gets built for it.
#
# Manual trigger only (no schedule): go to the Actions tab, pick this
# workflow, click "Run workflow". Uses the same repository secrets as the
# regular odds-refresh job (Settings -> Secrets and variables -> Actions).

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  list-sports:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: List sports from the API
        env:
          ONEXBET_CLIENT_ID: ${{ secrets.ONEXBET_CLIENT_ID }}
          ONEXBET_CLIENT_SECRET: ${{ secrets.ONEXBET_CLIENT_SECRET }}
          ONEXBET_REF: ${{ secrets.ONEXBET_REF }}
          ONEXBET_GR: ${{ secrets.ONEXBET_GR }}
        run: python scripts/list_sports.py
